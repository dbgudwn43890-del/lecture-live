name: encrypted database backup

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:18-bookworm
    timeout-minutes: 20
    steps:
      - name: Refuse public repository backups
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_IS_PRIVATE" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install encryption tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends age python3 ca-certificates
      - name: Create encrypted consistent snapshot
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/encrypted-backup
          BACKUP_MAX_BYTES: '268435456'
        run: python3 scripts/backup/create.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-database-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-backup/*.age
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
